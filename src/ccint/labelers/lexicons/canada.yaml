# canada.yaml — is_canada 判定。召回优先（HANDOFF §M4）。
#
# [MUST] 必须含法语条目：英法双语语料是本项目后续研究价值之一。
# [MUST] 词表改动 = bump label_version，旧 version 保留以便并排比较。
#
# 实测背景：法语专业术语在 Bluesky 上极稀薄（rançongiciel 七天仅 1 条），
# 故法语侧主要靠地名与机构名承载，而非译名术语。
#
# 所有 terms 都是正则片段，一律加引号（以 [ 开头的正则会被 YAML 误解析为 flow sequence）。
version: canada_v1

# negative_guards：geo/org 命中后复查，命中 guard 则该条命中作废。
# 压掉 HANDOFF §M4 点名的误判陷阱。
negative_guards:
  - pattern: "canada goose"
    reason: "服装品牌，非加拿大政府/地理指涉"
  - pattern: "canada dry"
    reason: "饮料品牌"
  - pattern: "air canada cent(?:re|er)"
    reason: "旧场馆名，通常为体育语境"

groups:
  geo:
    weight: 1.0
    terms:
      - "canada"
      - "canadian"
      - "canadien(?:ne)?s?"
      - "ottawa"
      - "toronto"
      - "vancouver"
      - "montr[ée]al"
      - "qu[ée]bec"
      - "qu[ée]b[ée]cois(?:e)?"
      - "alberta"
      - "ontario"
      - "manitoba"
      - "saskatchewan"
      - "nova scotia"
      - "nouvelle-[ée]cosse"
      - "new brunswick"
      - "nouveau-brunswick"
      - "newfoundland"
      - "terre-neuve"
      - "prince edward island"
      - "[îi]le-du-prince-[ée]douard"
      - "british columbia"
      - "colombie-britannique"
      - "yukon"
      - "nunavut"
      - "northwest territories"
      - "calgary"
      - "edmonton"
      - "winnipeg"
      - "halifax"
      - "mississauga"
      - "gatineau"
      - "saskatoon"
      - "GTA"

  org_gov:
    weight: 1.2
    terms:
      - "canada revenue agency"
      - "agence du revenu du canada"
      - "royal canadian mounted police"
      - "gendarmerie royale du canada"
      - "communications security establishment"
      - "centre de la s[ée]curit[ée] des t[ée]l[ée]communications"
      - "canadian centre for cyber security"
      - "centre canadien pour la cybers[ée]curit[ée]"
      - "service canada"
      - "shared services canada"
      - "services partag[ée]s canada"
      - "public safety canada"
      - "s[ée]curit[ée] publique canada"
      - "health canada"
      - "sant[ée] canada"
      - "elections canada"
      - "[ée]lections canada"
      - "statistics canada"
      - "statistique canada"
      - "global affairs canada"
      - "affaires mondiales canada"
      - "privacy commissioner of canada"
      - "commissariat [àa] la protection de la vie priv[ée]e"
      - "CSIS"
      - "SCRS"
      - "CRTC"
      - "OSFI"
      - "BSIF"

  # 缩写单列：召回高但歧义大。requires_cyber_context 要求同帖必须另有 cyber 命中，
  # 压掉 "CRA" = Credit Rating Agency / Clinical Research Associate 一类误判。
  org_abbrev:
    weight: 0.8
    requires_cyber_context: true
    # [决策记录] 缩写强制大小写敏感："CRA" 是加拿大税务局，"cra" 多半是别的词的片段。
    case_sensitive: true
    terms:
      - "CRA"
      - "ARC"
      - "RCMP"
      - "GRC"
      - "CSE"
      - "CST"
      - "CCCS"

  entities:
    weight: 1.0
    terms:
      - "royal bank of canada"
      - "RBC"
      - "scotiabank"
      - "banque scotia"
      - "TD Bank"
      - "Banque TD"
      - "bank of montreal"
      - "banque de montr[ée]al"
      - "CIBC"
      - "desjardins"
      - "national bank of canada"
      - "banque nationale du canada"
      - "rogers communications"
      - "TELUS"
      - "bell canada"
      - "shaw communications"
      - "vid[ée]otron"
      - "loblaw"
      - "canadian tire"
      - "sobeys"
      - "couche-tard"
      - "air canada"
      - "via rail"
      - "hydro[- ]qu[ée]bec"
      - "canada post"
      - "postes canada"

  domains:
    weight: 1.5
    terms:
      - "[a-z0-9-]+\\.gc\\.ca(?![a-z])"
      - "canada\\.ca"
      # [决策记录] 裸 .ca 域名不列入。实测它在粗筛中是主要误报源
      # （非加拿大站点大量使用 .ca），召回收益不抵精度损失。
