[project]
name = "ccint"
version = "0.1.0"
description = "Canada Cyber Social Intelligence — v0 walking skeleton"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgserver>=0.1.4",
    "typer>=0.12",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "langdetect>=1.0.9",
    "jinja2>=3.1",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
ccint = "ccint.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
